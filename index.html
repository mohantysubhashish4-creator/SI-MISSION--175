:root[data-theme="dark"]{--bg:#0d151b;--sf:#15212a;--sf2:#1a2833;--ink:#e6eef2;--ink2:#aebcc6;--mute:#82939e;--line:#26353f;--ac:#62b6e6;--ac-soft:#173345;--on-ac:#06202f;--done:#43c48f;--done-soft:#16342a;--warn:#e5b04f;--warn-soft:#3a2f14;--bad:#ff8f86;--bad-soft:#3d1d1a;--track:#27363f;--p0:#173345;--p1:#16342a;--p2:#3a2f14;--hero:#0a1f2d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--hero);color:#eaf3f8}
header .in{padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}

.hs{display:flex;align-items:center;gap:12px;font-size:12px;color:#a9c3d3}
.hs .bar{width:140px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}.hs .bar i{display:block;height:100%;background:#59d3a0;border-radius:4px}
.hs b{font:600 14px var(--mono);color:#fff}

main.in{padding-block:16px 48px}
h2{font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-.005em}
h3{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.c{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.mu{color:var(--mute);font-size:13px}.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpi{background:var(--sf2);border-radius:10px;padding:12px 14px;min-width:0}.kpi b{display:block;font:600 22px var(--mono);font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mute)}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sf2);border:1px solid var(--line);color:var(--ink2)}
.chip.ph0{background:var(--p0);border-color:transparent;color:var(--ac)}.chip.ph1{background:var(--p1);border-color:transparent;color:var(--done)}.chip.ph2{background:var(--p2);border-color:transparent;color:var(--warn)}
.chip.High,.chip.Very{background:var(--warn-soft);border-color:transparent;color:var(--warn)}.chip.ok{background:var(--done-soft);border-color:transparent;color:var(--done)}
/* day navigation */
.dn{display:flex;align-items:center;gap:10px;margin-bottom:14px}.dn .mid{flex:1;text-align:center;min-width:0}.dn .mid b{font-size:19px;font-weight:800}.dn .mid div{margin-top:2px}
.dn .btn{width:44px;padding:8px 0}
/* rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ring{margin:0;text-align:center}.ring svg{width:120px;height:120px;max-width:100%}.rt{fill:none;stroke:var(--track);stroke-width:10}.rv{fill:none;stroke:var(--done);stroke-width:10;stroke-linecap:round}
.ring text{fill:var(--ink);font:600 19px var(--mono)}.ring figcaption b{display:block;font-size:14px}.ring figcaption span{font-size:12px;color:var(--mute)}

.tasks{display:grid;gap:8px}
.task,.hab{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sf);cursor:pointer;min-width:0}
.task input,.hab input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--done)}
.task .tx{min-width:0;overflow-wrap:anywhere}.task small{display:block;font:500 12px var(--mono);color:var(--mute);margin-bottom:2px}
.task.on,.hab.on{background:var(--done-soft);border-color:transparent}.task.on .tx,.hab.on span{color:var(--ink2)}.task.on .tx{text-decoration:line-through;text-decoration-color:var(--mute)}
.habs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.hab{align-items:center;padding:10px 12px}
input[type=number],input[type=text],input[type=date],input[type=time],select{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:7px 9px;min-height:36px;max-width:100%}
input[type=number]{width:84px;font-family:var(--mono)}

.bars{display:flex;gap:6px;align-items:flex-end}
.bar{flex:1;min-width:0;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:11px;color:var(--mute);text-align:center}
.bar b{font:500 11px var(--mono);color:var(--ink2)}.bar .col{height:120px;display:flex;align-items:flex-end;background:var(--sf2);border-radius:6px 6px 0 0}.bar i{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0}
.bar.sel .col{outline:2px solid var(--ac)}.bar em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar.sel em{color:var(--ink);font-weight:700}
.bars.sm .col{height:80px}
.hb{display:grid;grid-template-columns:minmax(110px,230px) 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.hb>span{min-width:0;overflow-wrap:anywhere}
.hb u{display:block;height:10px;background:var(--track);border-radius:5px;overflow:hidden;text-decoration:none}.hb u i{display:block;height:100%;background:var(--ac);border-radius:0 5px 5px 0}.hb u i.g{background:var(--done)}.hb b{font:500 12px var(--mono);text-align:right}

.cell{aspect-ratio:1;border:0;border-radius:6px;font:500 11px var(--mono);color:var(--ink);cursor:pointer;padding:0}.cell.td{outline:2px solid var(--ink);outline-offset:1px}.cell.sel{outline:2px solid var(--ac);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sf)}.seg button{border:0;background:none;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on-ac)}

.dc{border:1px solid var(--line);border-radius:12px;background:var(--sf);margin-bottom:12px;overflow:hidden}.dc.td{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.dc.su .dh{background:var(--warn-soft)}

.dc .tasks{padding:10px 12px 12px}.dc .task{padding:8px 10px}

.note-p{font-size:13px;color:var(--ink2);margin:6px 0}
ul.tight{margin:0;padding-left:20px}ul.tight li{margin:4px 0}

function defaults(){return{ts:0,start:D.start,share:D.share,neg:D.neg,done:{},hab:{},hrs:{},syl:{},mk:{},marks:{},eff:{},rt:{}}}

/* ---------- saving: this device always, your account when signed in ---------- */
let dbRef=null,pushT=null,pushing=false,again=false;
function setSync(t){const e=$("sync");if(e)e.textContent=t}
function touch(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(dbRef){clearTimeout(pushT);pushT=setTimeout(push,1500)}}
async function push(){if(pushing){again=true;return}pushing=true;try{await dbRef.set({json:JSON.stringify(S),ts:S.ts});setSync("Synced to your account")}catch(e){setSync("Saved on this device only")}pushing=false;if(again){again=false;push()}}

const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dateOf=n=>{const x=parse(S.start);x.setDate(x.getDate()+n-1);return x};

const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=t=>{const[h,m]=t.split(":").map(Number);return((h+11)%12+1)+":"+String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM")};

const rhrs=r=>((toMin(r.b)-toMin(r.a)+1440)%1440)/60;

function vMocks(){const s=mkStats();
 return `<div class="c"><h2>Mock test log</h2><div class="grid"><div class="kpi"><b id="mkn">${s.n} / ${D.mk.length}</b><span>Mocks completed</span></div><div class="kpi"><b id="mks">${s.sc}</b><span>Average score</span></div><div class="kpi"><b id="mka">${s.ac}</b><span>Average accuracy</span></div></div>
 <p class="mu">Score is correct answers minus ${S.neg} for each wrong one. Target: 80% or more with 90% accuracy by Day 49. After each mock, copy every wrong answer into your error notebook.</p></div><div class="mgrid">${D.mk.map((_,i)=>mkCard(i)).join("")}</div>`}
/* ---------- PROGRESS ---------- */
function vProgress(){const sc=V.ps;let a,z,title,sub,step=0;
 if(sc=="day"){a=z=V.d;title="Day "+V.d;sub=fd(V.d)+" · "+PH[ph(V.d)];step=1}
 else if(sc=="week"){const w=wk(V.d);a=w*7-6;z=w*7;title="Week "+w;sub=fd(a)+" – "+fd(z);step=7}
 else if(sc=="month"){const m=mo(V.d);a=m*28-27;z=m*28;title="Month "+m;sub=fd(a)+" – "+fd(z)+" · "+(m==1?"Learn":"Revise and mocks");step=28}
 else{a=1;z=N;title="Full plan";sub=fd(1)+" – "+fd(N)}
 const g=agg(a,z),w=wk(V.d),m=mo(V.d);
 let kids="";
 if(sc=="week")kids=`<div class="c"><h2>Day by day</h2><p class="mu">Tap a bar to open that day's report.</p>${bars([...Array(7)].map((_,i)=>{const n=a+i;return{l:fd(n,{weekday:"short"})+" "+fd(n,{day:"numeric"}),p:dayPct(n),a:"pg",s:"day",n,sel:n==V.d,t:`Day ${n}`}}))}</div>`;
 if(sc=="month")kids=`<div class="c"><h2>Week by week</h2><p class="mu">Tap a bar to open that week's report.</p>${bars([0,1,2,3].map(i=>{const n=a+i*7,x=agg(n,n+6);return{l:"Week "+wk(n),p:x.all,a:"pg",s:"week",n,t:`Week ${wk(n)}`}}))}</div>`;
 if(sc=="plan")kids=`<div class="c"><h2>Month by month</h2>${bars([1,2].map(i=>({l:"Month "+i,p:agg(i*28-27,i*28).all,a:"pg",s:"month",n:i*28-27})))}</div><div class="c"><h2>Week by week</h2>${bars([...Array(8)].map((_,i)=>({l:"Wk "+(i+1),p:agg(i*7+1,i*7+7).all,a:"pg",s:"week",n:i*7+1,sel:i+1==w})),"sm")}</div><div class="c"><h2>All 56 days</h2>${heat(1,N,"pg")}</div>`;
 const items=`<div class="c"><h2>${sc=="day"?"Today's tasks":"By study block and habit"}</h2>${BLK.map((b,i)=>{let c=0;for(let d=a;d<=z;d++)if(S.done[d+":"+i])c++;return hb(`Block ${b} · ${["Maths / Reasoning","GS subject 1","Odia / English","GS subject 2","Current Affairs","MCQ practice","Notes revision"][i]}`,c/(z-a+1),0,sc=="day"?(c?"Done":"–"):"")}).join("")}<h3>Habits</h3>${D.hab.map((h,i)=>{let c=0;for(let d=a;d<=z;d++)if(S.hab[d+":"+i])c++;return hb(esc(h),c/(z-a+1),1,sc=="day"?(c?"Done":"–"):"")}).join("")}</div>`;
 let extra="";
 if(sc=="plan"){const mk=D.mk.map((x,i)=>({x,r:mkRes(i)})).filter(o=>o.r);
  extra=`<div class="c"><h2>Syllabus by subject</h2>${subjects.map(s=>{const x=sylDone(s);return hb(esc(s),x.p,1,`${x.c}/${x.t}`)}).join("")}</div>
  <div class="c"><h2>Mock scores</h2>${mk.length?bars(mk.map(o=>({l:o.x[0].replace("Full Mock","M").replace("FINAL Mock","Final").replace("Weekly test","T").replace("Mock ","M"),p:Math.max(0,o.r.pct),a:"tab",n:"mocks",t:o.x[0]})),"sm"):'<p class="mu">Log a mock on the Mock log tab and its score appears here.</p>'}</div>`}
 const nav=step?dayNav(title,sub,step).replace(/data-a="step" data-n="(-?\d+)"/g,'data-a="pstep" data-n="$1"'):`<div style="margin-bottom:14px"><b style="font-size:19px;font-weight:800">${title}</b><div class="mu">${sub}</div></div>`;
 return `<div class="seg" role="group" aria-label="Report range" style="margin-bottom:14px">${[["day","Day"],["week","Week"],["month","Month"],["plan","Plan"]].map(x=>`<button aria-pressed="${sc==x[0]}" data-a="pg" data-s="${x[0]}" data-n="${V.d}">${x[1]}</button>`).join("")}</div>${nav}
 <div class="c"><div class="rings">${ring(g.all,"Total done",`${g.done} of ${g.tot} tasks`)}${ring(g.st,"Study blocks",`${g.s} of ${7*g.n}`)}${ring(g.hb,"Habits",`${g.h} of ${12*g.n}`)}</div>
 <div class="row" style="margin-top:14px"><span class="mono">Study hours: ${g.hr} logged of ${g.plan.toFixed(0)} planned</span><span class="grow"></span>${sc!="plan"?`<button class="btn" data-a="day" data-n="${a}">Open ${sc=="day"?"checklist":"first day"}</button>`:""}</div>
 <div class="row" style="margin-top:8px">${sc!="week"?`<button class="btn" data-a="pg" data-s="week" data-n="${w*7-6}">Week ${w}</button>`:""}${sc!="month"?`<button class="btn" data-a="pg" data-s="month" data-n="${m*28-27}">Month ${m}</button>`:""}${sc!="plan"?`<button class="btn" data-a="pg" data-s="plan" data-n="1">Full plan</button>`:""}</div></div>${kids}${items}${extra}`}
/* ---------- shell ---------- */
const VIEWS={today:vToday,overview:vOverview,weightage:vWeight,plan:vPlan,syllabus:vSyllabus,habits:vHabits,routine:vRoutine,mocks:vMocks,progress:vProgress};
let firstHabits=true;
function head(){const td=todayN(),g=agg(1,N);$("hsub").textContent=td<1?"Starts "+fd(1,{weekday:"long",day:"numeric",month:"long"}):td>N?"56 days complete":`Day ${td} of ${N} · ${fd(td,{weekday:"long",day:"numeric",month:"long"})}`;$("hpct").innerHTML=`<b>${P(g.all)}</b> of the plan done`;$("hbar").style.width=P(g.all)}
function render(){const y=scrollY,sl=[...document.querySelectorAll(".scroll")].map(e=>e.scrollLeft);
 $("tabs").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${V.tab==t[0]}" data-a="tab" data-n="${t[0]}">${t[1]}</button>`).join("");
 $("app").innerHTML=VIEWS[V.tab]();head();
 [...document.querySelectorAll(".scroll")].forEach((e,i)=>{e.scrollLeft=sl[i]||0});
 if(V.tab=="habits"&&firstHabits){firstHabits=false;const c=$("tdcol"),s=$("mxs");if(c&&s)s.scrollLeft=Math.max(0,c.offsetLeft-220)}
 scrollTo(0,y)}
function go(tab){V.tab=tab;V.reset=false;try{history.replaceState(null,"","#"+tab)}catch(e){}if(tab=="habits")firstHabits=true;render();scrollTo(0,0);const a=document.querySelector('nav [aria-selected="true"]');if(a)a.scrollIntoView({inline:"center",block:"nearest"})}
/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,n=b.dataset.n;
 if(a=="tab")go(n);
 else if(a=="day"){V.d=clamp(+n);go("today")}
 else if(a=="step"){V.d=clamp(V.d+ +n);render();scrollTo(0,0)}
 else if(a=="pstep"){V.d=clamp(V.d+ +n);render()}
 else if(a=="week"){V.d=+n*7-6;render()}
 else if(a=="pg"){V.ps=b.dataset.s;V.d=clamp(+n);V.tab="progress";try{history.replaceState(null,"","#progress")}catch(x){}render();scrollTo(0,0)}
 else if(a=="allblocks"){const d=+n,on=bd(d)<7;for(let i=0;i<7;i++){if(on)S.done[d+":"+i]=1;else delete S.done[d+":"+i]}touch();render()}
 else if(a=="hab"){const k=b.dataset.id;if(S.hab[k])delete S.hab[k];else S.hab[k]=1;touch();render()}
 else if(a=="reset"){if(!V.reset){V.reset=true;render();setTimeout(()=>{if(V.reset){V.reset=false;if(V.tab=="overview")render()}},4000)}else{const k=S.start;S=defaults();S.start=k;touch();V.reset=false;render()}}});
function flag(map,k,v){if(v)map[k]=1;else delete map[k]}
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.k;if(!k){return}const id=t.dataset.id;let re=true;
 if(k=="done")flag(S.done,id,t.checked);
 else if(k=="hab")flag(S.hab,id,t.checked);
 else if(k=="hrs"){if(t.value==="")delete S.hrs[id];else S.hrs[id]=Math.max(0,Math.min(18,+t.value));re=false;const w=$("wkb");if(w)w.innerHTML=weeklyRows();head()}
 else if(k=="start"){if(t.value)S.start=t.value;else re=false}
 else if(k=="share"){S.share=Math.min(.9,Math.max(.1,(+t.value||50)/100))}
 else if(k=="neg"){S.neg=Math.max(0,+t.value||0)}
 else if(k=="marks"){S.marks[id]=Math.max(0,+t.value||0)}
 else if(k=="eff"){S.eff[id]=Math.max(.3,+t.value||1)}
 else if(k=="syS"){(S.syl[id]=S.syl[id]||{}).s=+t.value}
 else if(k=="syR1"){(S.syl[id]=S.syl[id]||{}).r1=t.checked?1:0}
 else if(k=="syR2"){(S.syl[id]=S.syl[id]||{}).r2=t.checked?1:0}
 else if(k=="syC"){(S.syl[id]=S.syl[id]||{}).c=+t.value}
 else if(k=="syN"){(S.syl[id]=S.syl[id]||{}).n=t.value;re=false}
 else if(k=="rtA"||k=="rtB"||k=="rtT"){const o=S.rt[id]=S.rt[id]||{};if(k=="rtA"&&t.value)o.a=t.value;if(k=="rtB"&&t.value)o.b=t.value;if(k=="rtT")o.t=t.value}
 else if(k.startsWith("mk")){const o=S.mk[id]=S.mk[id]||{},f={mkC:"c",mkW:"w",mkT:"t",mkN:"n"}[k];if(f=="n")o.n=t.value;else if(t.value==="")delete o[f];else o[f]=Math.max(0,+t.value);re=false;const r=document.querySelector(`[data-res="${id}"]`);if(r){r.innerHTML=mkRC(mkRes(+id));$("mk"+id).classList.toggle("fin",!!mkRes(+id));const s=mkStats();$("mkn").textContent=s.n+" / "+D.mk.length;$("mks").textContent=s.sc;$("mka").textContent=s.ac}}
 touch();if(re)render()});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="sq"){V.sq=t.value;$("sylList").innerHTML=sylRows()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id=="sf"||t.id=="ss"){V[t.id]=t.value;$("sylList").innerHTML=sylRows()}});

function exportData(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="si-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);const m=$("bkmsg");if(m)m.textContent="Backup file saved to your Downloads."}
document.addEventListener("click",e=>{if(e.target.closest('[data-a="export"]'))exportData()});
document.addEventListener("change",e=>{if(e.target.id!="imp")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=$("bkmsg");try{const o=JSON.parse(r.result);if(!o||typeof o!="object"||typeof o.done!="object")throw 0;S=Object.assign(defaults(),o);S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}render();const m2=$("bkmsg");if(m2)m2.textContent="Backup restored."}catch(x){if(m)m.textContent="That file is not a valid backup."}};r.readAsText(f)});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();initDb();
</script>
</body></html>
